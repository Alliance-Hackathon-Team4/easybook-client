name: CI

env:
  API_URL: ${{ secrets.API_URL }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Enable Corepack (Yarn)
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          echo "Yarn path: $(which yarn)"
          yarn --version

      - name: Setup Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create production env files
        run: |
          echo "API_URL=${{ secrets.API_URL }}" > .env.production
          echo "API_URL=${{ secrets.API_URL }}" > apps/admin/.env.production
          echo "API_URL=${{ secrets.API_URL }}" > apps/client/.env.production

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
        env:
          API_URL: ${{ secrets.API_URL }}

  pr-checks:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          requireScope: false
          subjectPattern: ".+"
          subjectPatternError: "PR 제목 넣어주세요."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment CI result on PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const status = '${{ needs.build.result }}';
            const message = status === 'success' 
              ? '✅ CI success'
              : '❌ CI failed';
            github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
